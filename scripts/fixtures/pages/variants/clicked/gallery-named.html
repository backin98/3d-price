<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>Elas PLA Pro Filament</title>
<style>body{font:16px sans-serif;width:1100px}#big{width:420px;height:420px;display:block}.thumbs img{width:90px;height:90px}.variant-list button{margin:3px}</style></head>
<body><main><div class="product-detail"><img id="big" src="/img/elas-main.png" width="420" height="420" alt="Elas PLA Pro Filament">
<div class="thumbs"><img src="/img/elas-pla-pro-siyah.png" alt=""><img src="/img/elas-pla-pro-beyaz.png" alt=""><img src="/img/elas-1.png" alt="Elas PLA Pro Lacivert"></div>
<h1>Elas PLA Pro Filament</h1><div class="product-price"><span id="pr">449,90 TL</span></div>
<div class="product-variant"><div class="variant-title">Renk: <span id="sel">Seçiniz</span></div><div class="variant-list">
<button type="button">Siyah</button><button type="button">Beyaz</button><button type="button">Lacivert</button>
</div></div><button>Sepete Ekle</button></div></main>
<script>
// The click only names the colour: the photos sit in the gallery under the colours' names.
document.querySelectorAll('.variant-list button').forEach((b) => b.addEventListener('click', () => setTimeout(() => { document.getElementById('sel').textContent = b.textContent; }, 120)));
</script>
</body></html>
