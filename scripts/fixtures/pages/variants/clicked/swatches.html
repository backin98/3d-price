<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>Elas PLA Pro Filament</title>
<style>body{font:16px sans-serif;width:1100px}#img{width:400px;height:400px;display:block}.swatch-list label{display:inline-block;width:34px;height:34px;margin:3px;border-radius:50%;border:1px solid #333;cursor:pointer}.swatch-list input{display:none}</style></head>
<body><main><div class="product"><img id="img" src="/img/elas.png" width="400" height="400" alt="">
<h1>Elas PLA Pro Filament</h1><div class="product-price"><span id="pr">449,90 TL</span></div>
<div class="variant-box"><div id="sel">Renk: Seçiniz</div><div class="swatch-list" id="sw"></div></div>
<button id="cart" disabled>Sepete Ekle</button></div></main>
<script>
const C = [['Siyah', '#000', '449,90 TL', true], ['Beyaz', '#fff', '449,90 TL', true], ['Lacivert', '#123', '469,90 TL', false]];
C.forEach(([name, hex, price, stock], i) => {
  const l = document.createElement('label'); l.style.background = hex; l.htmlFor = 'c' + i;
  const r = document.createElement('input'); r.type = 'radio'; r.name = 'renk'; r.id = 'c' + i; r.value = 'v' + i;
  l.appendChild(r);
  l.onclick = () => setTimeout(() => { document.getElementById('sel').textContent = 'Renk: ' + name; document.getElementById('pr').textContent = price; document.getElementById('img').src = '/img/elas-' + i + '.png'; const b = document.getElementById('cart'); b.disabled = !stock; b.textContent = stock ? 'Sepete Ekle' : 'Tükendi'; }, 100);
  document.getElementById('sw').appendChild(l);
});
</script></body></html>
