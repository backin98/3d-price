<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>Porima PLA Filament - 1Kg</title>
<style>body{font:16px sans-serif;width:1100px}#big{width:420px;height:420px;display:block}.slides img{width:90px;height:90px}.variant-list a{display:inline-block;margin:3px}.variant-list img{width:40px;height:40px;display:block}</style></head>
<body><main><div class="product-detail"><img id="big" src="/img/porima-pla-main.png" width="420" height="420" alt="">
<div class="slides" id="slides"><img src="/img/porima-pla-main.png" alt=""></div>
<h1>Porima PLA Filament - 1Kg</h1><div class="product-price"><span id="pr">771,37 TL</span></div>
<div class="product-variant"><div class="variant-title">Renk: <span id="sel">Seçiniz</span></div><div class="variant-list">
<a href="javascript:void(0)" title="Siyah"><img src="/img/porima-pla-main.png" alt="Siyah"></a>
<a href="javascript:void(0)" title="Beyaz"><img src="/img/porima-pla-main.png" alt="Beyaz"></a>
<a href="javascript:void(0)" title="Kırmızı"><img src="/img/porima-pla-main.png" alt="Kırmızı"></a>
</div></div><button>Sepete Ekle</button></div></main>
<script>document.querySelectorAll('.variant-list a').forEach((a) => a.addEventListener('click', () => setTimeout(() => {
  document.getElementById('sel').textContent = a.title;
  document.getElementById('slides').innerHTML = '<img src="/img/porima-pla-' + a.title.toLowerCase().replace(/ı/g, 'i') + '.png" alt="">';
}, 120)));</script>
</body></html>
