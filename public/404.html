<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sayfa bulunamadı · 3D Price</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0a1018" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <style>
    :root { --bg: #fffdf8; --ink: #121820; --mute: #5c6b78; --ticket: #ffc43d; --ticket-ink: #3a2a00; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0a1018; --ink: #e7eef3; --mute: #8b98a6; } }
    :root[data-theme="dark"] { --bg: #0a1018; --ink: #e7eef3; --mute: #8b98a6; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink); font-family: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 34rem; text-align: center; }
    svg { width: 56px; height: 56px; }
    .code { margin-top: 12px; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 14px; letter-spacing: .1em; color: var(--mute); }
    h1 { margin: .35em 0; font-family: Sora, system-ui, sans-serif; font-size: clamp(1.6rem, 1.2rem + 2vw, 2.4rem); line-height: 1.15; }
    p { margin: .6em 0; color: var(--mute); line-height: 1.5; }
    a { display: inline-block; margin-top: 1rem; padding: .75rem 1.25rem; border-radius: 999px; background: var(--ticket); color: var(--ticket-ink); font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="6" fill="#121820"/><path d="M7 8h14l4 8-4 8H7V8Z" fill="#FFC43D"/><path d="M7 8v16l-2.2-1.2V9.2L7 8Z" fill="#C49212"/><circle cx="19" cy="16" r="1.6" fill="#121820"/></svg>
    <div class="code">404</div>
    <h1>Bu sayfa bulunamadı</h1>
    <p>Aradığınız sayfa taşınmış ya da hiç olmamış olabilir. Tüm 3D yazıcı ve filament fiyatları ana sayfada.</p>
    <p lang="en">This page does not exist. Every 3D printer and filament price is on the home page.</p>
    <a href="/">Ana sayfa · Home</a>
  </main>
</body>
</html>
